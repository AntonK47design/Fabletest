<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EMBER DRIFT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0b0a14;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; display: block; }
  /* CRT overlay */
  #crt {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg,
        rgba(0,0,0,0.00) 0px,
        rgba(0,0,0,0.00) 2px,
        rgba(0,0,0,0.10) 3px,
        rgba(0,0,0,0.10) 4px);
    mix-blend-mode: multiply;
    z-index: 10;
  }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(5,3,12,0.5) 100%);
    z-index: 11;
  }
</style>
</head>
<body>
<!-- CrazyGames SDK. Optional by design: every call is guarded, so the game
     still runs standalone (itch, GitHub Pages, local file) if this 404s. -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<canvas id="game"></canvas>
<div id="crt"></div>
<div id="vignette"></div>
<script>
"use strict";

/* ============================================================
   EMBER DRIFT — a tiny indie arcade game
   You are a drifting ember. Collect wisps. Dodge the shades.
   Descend through the Depths. Survive the surges.

   Rendering: everything — world, HUD and menus — is drawn into one
   low-res buffer with Courier New, then upscaled with nearest-neighbor.
   That upscale is what gives the text its chunky pixel character.
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// low-res world buffer (the pixel-art layer)
const world = document.createElement("canvas");
const wctx = world.getContext("2d");
let g = wctx;   // current draw target for the shared helpers

/* ---------- CrazyGames SDK (optional) ----------
   Every entry point is guarded and try/caught, so an absent or failed SDK
   degrades to plain localStorage instead of breaking the game. */
const CG = (() => {
  let sdk = null, ready = false;
  return {
    get ready() { return ready; },
    async init() {
      try {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          sdk = window.CrazyGames.SDK;
          await sdk.init();          // preloads saved data; must finish before data.get
          ready = true;
        }
      } catch (e) { sdk = null; ready = false; }
      return ready;
    },
    data: {
      get(k) { try { if (ready) { const v = sdk.data.getItem(k); return v === undefined ? null : v; } } catch (e) {} return null; },
      set(k, v) { try { if (ready) { sdk.data.setItem(k, String(v)); return true; } } catch (e) {} return false; }
    },
    /* Midgame ad. The SDK enforces its own frequency cap (max 1 per 3 min,
       accounting for session start), so per their docs we may request at any
       opportune moment and early requests are simply ignored. onDone always
       fires exactly once, including when the SDK is absent or misbehaving,
       so the game can never be left stuck behind an ad that never resolves. */
    requestMidgameAd(onDone) {
      let settled = false;
      const finish = () => { if (settled) return; settled = true; onAdEnd(); onDone(); };
      if (!ready) { onDone(); return; }
      /* Two guards, because the two failure modes need different patience.
         Before adStarted we are only waiting on an auction, so 8s is generous.
         After adStarted a real ad is on screen and may run 30s+ — cutting that
         short would unmute the game over a playing ad, which their ad
         requirements forbid — so it gets a much longer last-resort guard. */
      let guard = setTimeout(finish, 8000);
      const done = () => { clearTimeout(guard); finish(); };
      try {
        sdk.ad.requestAd("midgame", {
          adStarted: () => {                      // mute + pause, per their requirements
            onAdStart();
            clearTimeout(guard);
            guard = setTimeout(finish, 60000);
          },
          adFinished: () => done(),
          adError:    () => done()                // unfilled / adblock / disabled in Basic Launch
        });
      } catch (e) { done(); }
    },
    loadingStart()  { try { if (ready) sdk.game.loadingStart(); }  catch (e) {} },
    loadingStop()   { try { if (ready) sdk.game.loadingStop(); }   catch (e) {} },
    gameplayStart() { try { if (ready) sdk.game.gameplayStart(); } catch (e) {} },
    gameplayStop()  { try { if (ready) sdk.game.gameplayStop(); }  catch (e) {} },
    happytime()     { try { if (ready) sdk.game.happytime(); }     catch (e) {} }
  };
})();

/* ---------- safe storage ----------
   Order matters: CrazyGames cloud save first, because a cross-origin iframe
   blocks localStorage outright on Safari and the high score would vanish.
   localStorage is the off-platform path; memory is the last resort. */
const store = (() => {
  const mem = {};
  let ok = false;
  try {
    localStorage.setItem("__ed_t", "1");
    localStorage.removeItem("__ed_t");
    ok = true;
  } catch (e) { ok = false; }
  return {
    get(k, dflt) {
      const cloud = CG.data.get(k);
      if (cloud !== null) return cloud;
      if (ok) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} }
      return (k in mem) ? mem[k] : dflt;
    },
    set(k, v) {
      mem[k] = String(v);
      CG.data.set(k, v);
      if (ok) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
    }
  };
})();

/* ---------- responsive canvas (fills a 16:9 iframe, logical height fixed) ---------- */
let W = 533, H = 300, viewScale = 1;
function fitCanvas() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  H = 300;
  W = Math.max(100, Math.round(H * canvas.width / canvas.height));
  world.width = W;
  world.height = H;
  viewScale = canvas.height / H;
  makeStars();
  clampEntities();
}
function isPortrait() { return window.innerHeight > window.innerWidth; }
window.addEventListener("resize", fitCanvas);

/* ---------- palette ---------- */
const PAL = {
  ember: "#ffb347", emberHot: "#ffe8b0", emberCore: "#fff6e0",
  wisp: "#7df9ff", wispDim: "#3fb8c9",
  shade: "#b14aed", shadeDim: "#5b2380",
  danger: "#ff4a6a",
  text: "#e8e0d0", textDim: "#9088a0",
  gold: "#ffd700", frost: "#9fd8ff"
};

/* ---------- zones: each depth changes a rule, not just the palette ----------
   Depth clock = elapsed run time + score * 0.5, so survival always advances
   you, and skilled collecting descends faster. */
const ZONES = [
  { at: 0,   num: "I",   name: "EMBERWOOD",
    rule: "the shades wander",
    bg: ["#0b0a14", "#141226", "#1d1a33"], hills: ["#16132a", "#1b1733"] },
  { at: 45,  num: "II",  name: "THE HOLLOW",
    rule: "the shades learn to lunge",
    bg: ["#0a0d18", "#101a2e", "#152640"], hills: ["#122038", "#17294c"] },
  { at: 100, num: "III", name: "VERDANT ASH",
    rule: "the shades encircle their prey",
    bg: ["#0a120e", "#0f2018", "#143026"], hills: ["#0f2a1e", "#143a2a"] },
  { at: 165, num: "IV",  name: "CINDER MAW",
    rule: "they shatter — but your dash now repels",
    bg: ["#150a0a", "#271212", "#3b1818"], hills: ["#2b1414", "#3b1c18"] },
  { at: 240, num: "V",   name: "THE VOID CHOIR",
    rule: "the choir sings — surges quicken",
    bg: ["#0d0a18", "#1a1232", "#2b1b4d"], hills: ["#1f153a", "#2b1d52"] },
];

/* ---------- utils ---------- */
const rnd  = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const TAU = Math.PI * 2;

function hexToRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgbStr(c) { return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; }
function lerpRgb(a, b, t) { return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

// live-blended zone colors (smoothly chase the current zone's palette)
const curBg   = ZONES[0].bg.map(hexToRgb);
const curHill = ZONES[0].hills.map(hexToRgb);

/* ---------- audio (tiny chiptune synth, no external assets) ----------
   Browsers keep an AudioContext suspended until a real user gesture.
   Chrome forgives a late unlock via sticky activation; Safari does not,
   so the context is created/resumed from EVERY gesture type, in the
   capture phase, at window level — nothing can swallow the unlock. */
let AC = null, muted = false;
/* CrazyGames requires platform mute to take priority over the in-game
   toggle, so audio plays only when BOTH are unmuted. Flipping the in-game
   speaker can never re-enable sound while the platform has muted us. */
let sdkMuted = false;
let adBusy = false;          // true from ad request until adFinished/adError
function audioMuted() { return muted || sdkMuted; }
/* Their ad requirements: mute and pause when the ad actually STARTS (not when
   requested — muting on an unfilled request is a silent glitch to the player),
   and unmute when it finishes or errors. */
function onAdStart() { sdkMuted = true; }
function onAdEnd()   { sdkMuted = false; adBusy = false; }
window.emberDriftSetMute = v => { sdkMuted = !!v; };
function audio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended" || AC.state === "interrupted") AC.resume();
  } catch (e) {}
  return AC;
}
for (const ev of ["pointerdown", "touchstart", "touchend", "mousedown", "keydown", "click"]) {
  window.addEventListener(ev, audio, { capture: true, passive: true });
}
// iOS drops the context to "interrupted" when backgrounded or on a phone call.
// visibilitychange alone cannot revive it — WebKit needs a real gesture — so the
// listeners above (touchend especially) are the actual recovery path.
document.addEventListener("visibilitychange", () => { if (!document.hidden) audio(); });
window.addEventListener("focus", audio);

function beep(freq, dur, type = "square", vol = 0.08, slide = 0) {
  if (audioMuted()) return;
  try {
    const ac = audio();
    if (!ac || ac.state !== "running") return;
    const o = ac.createOscillator(), g2 = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
    g2.gain.setValueAtTime(vol, ac.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g2).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch (e) { /* audio blocked until interaction */ }
}
const sfx = {
  collect(combo) { beep(520 + combo * 60, 0.12, "square", 0.06, 200); },
  dash()    { beep(220, 0.15, "sawtooth", 0.05, -120); },
  hit()     { beep(110, 0.4, "sawtooth", 0.12, -70); beep(55, 0.5, "square", 0.1, -20); },
  start()   { beep(330, 0.1, "square", 0.05); setTimeout(() => beep(440, 0.1, "square", 0.05), 90); setTimeout(() => beep(660, 0.18, "square", 0.06), 180); },
  near()    { beep(880, 0.05, "triangle", 0.025); },
  zone()    { beep(392, 0.12, "square", 0.06); setTimeout(() => beep(523, 0.12, "square", 0.06), 110); setTimeout(() => beep(784, 0.25, "square", 0.07), 220); },
  power()   { beep(660, 0.09, "triangle", 0.07, 300); setTimeout(() => beep(990, 0.15, "triangle", 0.06), 80); },
  shieldPop() { beep(300, 0.3, "square", 0.09, -150); },
  warn()    { beep(180, 0.22, "square", 0.07); setTimeout(() => beep(180, 0.22, "square", 0.07), 300); }
};

/* ---------- first input: unlock audio + play the start jingle ----------
   Safari only lets an AudioContext start from inside a gesture handler, so
   this must run here and not lazily from the game loop, or the run is mute. */
function firstInput() {
  const first = !inputSeen;
  inputSeen = true;
  audio();
  if (first) sfx.start();
}

/* ---------- input: keyboard ---------- */
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  firstInput();
  if (e.code === "KeyM") { muted = !muted; if (!muted) sfx.collect(1); return; }
  if (state === "over") { tryRestart(); return; }
  if (e.code === "Space") wantDash = true;
});
window.addEventListener("keyup", e => keys[e.code] = false);

/* ---------- input: touch (floating joystick + dash button) ---------- */
let isTouch = false;                 // shows touch UI once a touch is seen
let joy = null;                      // { id, bx, by, kx, ky } in canvas coords
const JOY_R = 28;                    // joystick travel radius
const JOY_DEAD = 6;                  // dead zone so a resting thumb doesn't drift
const DASH_R = 28;                   // thumb-sized dash button
function dashBtnPos() { return { x: W - DASH_R - 16, y: H - DASH_R - 14 }; }
const SPK = { x: 18, y: 17, r: 13 };   // mute toggle, top-left

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}

canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") isTouch = true;
  firstInput();
  const p = canvasPos(e);
  // speaker toggle first, so it works on every screen including game over
  if (dist2(p.x, p.y, SPK.x, SPK.y) < SPK.r * SPK.r) {
    muted = !muted;
    if (!muted) sfx.collect(1);
    return;
  }
  if (state === "over") { tryRestart(); return; }
  const db = dashBtnPos();
  // dash button (generous hit area beyond the visual)
  if (dist2(p.x, p.y, db.x, db.y) < (DASH_R + 12) ** 2) {
    wantDash = true;
    return;
  }
  if (joy === null) {
    // floating joystick spawns where the thumb lands
    joy = { id: e.pointerId, bx: p.x, by: p.y, kx: p.x, ky: p.y };
  } else {
    // any second finger = dash
    wantDash = true;
  }
});
window.addEventListener("pointermove", e => {
  if (joy && e.pointerId === joy.id) {
    const p = canvasPos(e);
    const dx = p.x - joy.bx, dy = p.y - joy.by;
    const m = Math.hypot(dx, dy);
    if (m > JOY_R) {
      // drag the base along so steering reversals feel instant
      joy.bx = p.x - dx / m * JOY_R;
      joy.by = p.y - dy / m * JOY_R;
    }
    joy.kx = p.x; joy.ky = p.y;
  }
});
function endTouch(e) { if (joy && e.pointerId === joy.id) joy = null; }
window.addEventListener("pointerup", endTouch);
window.addEventListener("pointercancel", endTouch);

function joyVec() {
  if (!joy) return null;
  const dx = joy.kx - joy.bx, dy = joy.ky - joy.by;
  const m = Math.hypot(dx, dy);
  if (m < JOY_DEAD) return { x: 0, y: 0, m: 0 };
  return { x: dx / m, y: dy / m, m: clamp((m - JOY_DEAD) / (JOY_R - JOY_DEAD), 0, 1) };
}

/* ---------- game state ---------- */
let state = "play";           // play | over  (no title gate — land in gameplay)
let t = 0;                    // global time
let runT = 0;                 // elapsed time of the current run
let score = 0, best = +store.get("emberdrift_best", "0") || 0;
let combo = 0, comboTimer = 0;
let shake = 0, flash = 0, slowmo = 0;
let wantDash = false;
let overTimer = 0;

let inputSeen = false;        // fades the title overlay
let titleA = 1;               // title-as-overlay alpha, first page view only
let firstRun = store.get("emberdrift_tut", "0") !== "1";
let tutStage = firstRun ? 0 : 3;  // 0 steer, 1 collect, 2 dash, 3 done
let moveHeld = 0;
let emberAcc = 0, trailAcc = 0, nearSfxT = 0;   // rate limiters, see below

let zoneIdx = 0, zoneBanner = 0;   // banner countdown for zone announcements
let frostT = 0;                    // frost power-up: shades slowed
let surgeT = 45, surgeWarn = 0;    // surge event timers
let puSpawnT = 30;                 // power-up spawn timer

const GRACE = 4;                   // seconds before the first shade may spawn

function depthClock() { return runT + score * 0.5; }
function zoneForClock(c) {
  let z = 0;
  for (let i = 0; i < ZONES.length; i++) if (c >= ZONES[i].at) z = i;
  return z;
}

// enemy speed grows with elapsed run time
function timeSpeedBonus() { return Math.min(runT * 0.009, 1.3); }

const player = {
  x: 266, y: 150, vx: 0, vy: 0,
  r: 5, angle: 0,
  dashCd: 0, dashT: 0, alive: true,
  shield: false, inv: 0,
  trail: []
};

let wisps = [];     // collectibles
let shades = [];    // enemies
let powerups = [];  // shield / frost pickups
let parts = [];     // particles
let stars = [];     // background
let embers = [];    // ambient floating motes

function makeStars() {
  stars = [];
  const n = Math.round(W / 7);
  for (let i = 0; i < n; i++) {
    stars.push({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.2, 1), tw: rnd(0, TAU) });
  }
  embers = [];
  for (let i = 0; i < Math.round(W / 30); i++) {
    embers.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(0.5, 1.6), ph: rnd(0, TAU) });
  }
}

function clampEntities() {
  player.x = clamp(player.x, 10, W - 10);
  player.y = clamp(player.y, 10, H - 10);
  for (const wsp of wisps) { wsp.x = clamp(wsp.x, 20, W - 20); wsp.y = clamp(wsp.y, 20, H - 20); }
  for (const pu of powerups) { pu.x = clamp(pu.x, 20, W - 20); pu.y = clamp(pu.y, 20, H - 20); }
}

function spawnWisp() {
  let x, y, tries = 0;
  do {
    x = rnd(30, W - 30); y = rnd(30, H - 30); tries++;
  } while (dist2(x, y, player.x, player.y) < 80 * 80 && tries < 20);
  wisps.push({ x, y, ph: rnd(0, TAU), r: 4, pulse: 0 });
}

function edgeSpawnPoint() {
  const side = rndi(0, 3);
  if (side === 0) return { x: -15, y: rnd(0, H) };
  if (side === 1) return { x: W + 15, y: rnd(0, H) };
  if (side === 2) return { x: rnd(0, W), y: -15 };
  return { x: rnd(0, W), y: H + 15 };
}

function spawnShade(forceType) {
  const { x, y } = edgeSpawnPoint();
  const speed = rnd(0.7, 1.0) + timeSpeedBonus();

  // enemy pool widens as you descend through zones
  let type = forceType;
  if (!type) {
    const pool = ["seeker", "seeker"];
    if (zoneIdx >= 1) pool.push("darter");
    if (zoneIdx >= 2) pool.push("orbiter");
    if (zoneIdx >= 3) pool.push("splitter", "darter");
    if (zoneIdx >= 4) pool.push("orbiter", "darter");
    type = pool[rndi(0, pool.length - 1)];
  }

  const s = {
    x, y, speed, type,
    r: rnd(6, 9), wob: rnd(0, TAU),
    darting: 0, dartCd: rnd(2, 3.5), windup: 0, dvx: 0, dvy: 0,
    orbA: rnd(0, TAU), orbR: rnd(70, 100), orbDir: Math.random() < 0.5 ? 1 : -1,
    kvx: 0, kvy: 0,          // knockback from the ignited dash
    small: false
  };
  if (type === "splitter") { s.r = rnd(11, 13); s.speed *= 0.65; }
  shades.push(s);
  return s;
}

function spawnSmallShade(x, y) {
  const s = spawnShade("seeker");
  s.x = x + rnd(-6, 6); s.y = y + rnd(-6, 6);
  s.r = 4; s.speed *= 1.5; s.small = true;
}

function spawnPowerup() {
  let x, y, tries = 0;
  do { x = rnd(40, W - 40); y = rnd(40, H - 40); tries++; }
  while (dist2(x, y, player.x, player.y) < 60 * 60 && tries < 20);
  const type = Math.random() < 0.55 ? "shield" : "frost";
  powerups.push({ x, y, type, ttl: 11, ph: rnd(0, TAU) });
}

function burst(x, y, color, n, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(spd * 0.3, spd);
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rnd(life * 0.5, life), max: life, color, size: rnd(1, 2.5)
    });
  }
}

function reset() {
  player.x = W / 2; player.y = H / 2;
  player.vx = player.vy = 0;
  player.dashCd = 0; player.dashT = 0;
  player.alive = true;
  player.shield = false; player.inv = 0;
  player.trail = [];
  wisps = []; shades = []; parts = []; powerups = [];
  score = 0; combo = 0; comboTimer = 0;
  shake = 0; flash = 0; slowmo = 0;
  runT = 0;
  zoneIdx = 0; zoneBanner = 0;
  frostT = 0; surgeT = rnd(40, 50); surgeWarn = 0; puSpawnT = rnd(26, 32);
  wantDash = false;
  joy = null;
  for (let i = 0; i < 4; i++) spawnWisp();
  shadeSpawnT = 0;
}

function tryRestart() {
  if (adBusy) return;          // no progressing the game while an ad is in flight
  if (overTimer < 0.8) return; // prevent accidental restart
  reset();
  state = "play";
  sfx.start();
  CG.gameplayStart();
}

let shadeSpawnT = 0;

function addScore(n) {
  score += n;
}

function checkZone() {
  const z = zoneForClock(depthClock());
  if (z > zoneIdx) {
    zoneIdx = z;
    zoneBanner = 3.5;
    sfx.zone();
    flash = 0.4;
    // telegraph the rule change: a moment of slow-mo + fresh wisps
    slowmo = Math.max(slowmo, 0.6);
    for (let i = 0; i < 2; i++) spawnWisp();
  }
}

/* ---------- update ---------- */
function update(dt) {
  t += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 3);
  if (slowmo > 0) slowmo = Math.max(0, slowmo - dt);
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
  if (zoneBanner > 0) zoneBanner -= dt;
  if (frostT > 0) frostT -= dt;
  if (player.inv > 0) player.inv -= dt;
  if (inputSeen && titleA > 0) titleA = Math.max(0, titleA - dt * 1.5);

  // blend palette toward current zone
  const zc = ZONES[zoneIdx];
  const bt = Math.min(dt * 1.2, 1);
  for (let i = 0; i < 3; i++) curBg[i] = lerpRgb(curBg[i], hexToRgb(zc.bg[i]), bt);
  for (let i = 0; i < 2; i++) curHill[i] = lerpRgb(curHill[i], hexToRgb(zc.hills[i]), bt);

  const ts = slowmo > 0 ? 0.35 : 1; // time scale
  const d = dt * ts;

  // ambient motes
  for (const e of embers) {
    e.ph += dt;
    e.x += Math.sin(e.ph * 0.7) * 0.1 * e.s;
    e.y -= 0.08 * e.s;
    if (e.y < -5) { e.y = H + 5; e.x = rnd(0, W); }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * d * 60; p.y += p.vy * d * 60;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }

  if (state !== "play") {
    if (state === "over") overTimer += dt;
    return;
  }

  runT += dt;
  checkZone();

  /* --- player movement --- */
  let ax = 0, ay = 0;
  if (keys.ArrowLeft  || keys.KeyA) ax -= 1;
  if (keys.ArrowRight || keys.KeyD) ax += 1;
  if (keys.ArrowUp    || keys.KeyW) ay -= 1;
  if (keys.ArrowDown  || keys.KeyS) ay += 1;
  const jv = joyVec();
  if (jv) { ax = jv.x * jv.m; ay = jv.y * jv.m; }
  const am = Math.hypot(ax, ay);
  if (am > 1) { ax /= am; ay /= am; }

  // tutorial stage 0: advance once the player has actually steered a bit
  if (tutStage === 0 && am > 0.05) {
    moveHeld += dt;
    if (moveHeld > 0.6) tutStage = 1;
  }

  const ACC = 560, FRIC = 0.90, MAXV = 205;
  player.vx += ax * ACC * d;
  player.vy += ay * ACC * d;
  player.vx *= Math.pow(FRIC, d * 60);
  player.vy *= Math.pow(FRIC, d * 60);
  const v = Math.hypot(player.vx, player.vy);
  if (v > MAXV && player.dashT <= 0) { player.vx = player.vx / v * MAXV; player.vy = player.vy / v * MAXV; }

  // dash
  player.dashCd = Math.max(0, player.dashCd - dt);
  if (player.dashT > 0) player.dashT -= dt;
  if (wantDash && player.dashCd <= 0 && (am > 0.1 || v > 20)) {
    const dxn = am > 0.1 ? ax / (am || 1) : player.vx / v;
    const dyn = am > 0.1 ? ay / (am || 1) : player.vy / v;
    player.vx = dxn * 480; player.vy = dyn * 480;
    player.dashCd = 0.9; player.dashT = 0.16;
    burst(player.x, player.y, PAL.emberHot, 14, 3, 0.4);
    shake = Math.max(shake, 2.5);
    sfx.dash();
    if (tutStage === 2) { tutStage = 3; store.set("emberdrift_tut", "1"); }
    // Depth IV rule: the ignited dash repels nearby shades
    if (zoneIdx >= 3) {
      for (const s of shades) {
        const dx = s.x - player.x, dy = s.y - player.y;
        const m = Math.hypot(dx, dy);
        if (m < 70 && m > 0.01) {
          s.kvx += dx / m * 260 * (1 - m / 70);
          s.kvy += dy / m * 260 * (1 - m / 70);
        }
      }
      burst(player.x, player.y, PAL.danger, 10, 3.5, 0.4);
    }
  }
  wantDash = false;

  player.x += player.vx * d;
  player.y += player.vy * d;

  // soft walls
  const pad = 8;
  if (player.x < pad)     { player.x = pad;     player.vx *= -0.5; }
  if (player.x > W - pad) { player.x = W - pad; player.vx *= -0.5; }
  if (player.y < pad)     { player.y = pad;     player.vy *= -0.5; }
  if (player.y > H - pad) { player.y = H - pad; player.vy *= -0.5; }

  if (v > 5) player.angle = Math.atan2(player.vy, player.vx);

  /* Trail and exhaust are sampled on a fixed clock rather than once per frame,
     so a 144Hz display gets the same trail length and particle density as 60Hz. */
  trailAcc += dt;
  while (trailAcc >= 1 / 60) {
    trailAcc -= 1 / 60;
    player.trail.unshift({ x: player.x, y: player.y, dash: player.dashT > 0 });
    if (player.trail.length > 16) player.trail.pop();
  }

  emberAcc += dt;
  while (emberAcc >= 1 / 36) {          // ~36 motes/sec, matching the old 60Hz rate
    emberAcc -= 1 / 36;
    parts.push({
      x: player.x + rnd(-2, 2), y: player.y + rnd(-2, 2),
      vx: -player.vx * 0.004 + rnd(-0.3, 0.3), vy: -player.vy * 0.004 + rnd(-0.5, -0.1),
      life: rnd(0.3, 0.7), max: 0.7, color: PAL.ember, size: rnd(1, 2)
    });
  }

  /* --- wisps --- */
  for (let i = wisps.length - 1; i >= 0; i--) {
    const wsp = wisps[i];
    wsp.ph += dt * 3;
    wsp.pulse = Math.max(0, wsp.pulse - dt * 4);
    // gentle attraction when close
    const dd = dist2(wsp.x, wsp.y, player.x, player.y);
    if (dd < 45 * 45) {
      const m = Math.sqrt(dd) || 1;
      wsp.x += (player.x - wsp.x) / m * 70 * d;
      wsp.y += (player.y - wsp.y) / m * 70 * d;
    }
    if (dd < (player.r + wsp.r + 3) ** 2) {
      wisps.splice(i, 1);
      combo = Math.min(combo + 1, 8);
      comboTimer = 3;
      sfx.collect(combo);
      burst(wsp.x, wsp.y, PAL.wisp, 16, 2.6, 0.55);
      burst(wsp.x, wsp.y, "#ffffff", 5, 1.2, 0.3);
      shake = Math.max(shake, 1.5);
      spawnWisp();
      if (wisps.length < 3 + Math.floor(score / 25)) spawnWisp();
      addScore(combo);
      if (tutStage === 1) tutStage = 2;
    }
  }

  /* --- power-ups --- */
  puSpawnT -= dt;
  if (puSpawnT <= 0 && powerups.length < 2 && runT > 25) {
    spawnPowerup();
    puSpawnT = rnd(16, 22);
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.ph += dt * 4;
    pu.ttl -= dt;
    if (pu.ttl <= 0) { powerups.splice(i, 1); continue; }
    if (dist2(pu.x, pu.y, player.x, player.y) < (player.r + 8) ** 2) {
      powerups.splice(i, 1);
      sfx.power();
      if (pu.type === "shield") {
        player.shield = true;
        burst(pu.x, pu.y, PAL.gold, 18, 2.5, 0.6);
      } else {
        frostT = 4.5;
        burst(pu.x, pu.y, PAL.frost, 22, 3, 0.7);
        flash = 0.25;
      }
    }
  }

  /* --- surge events (waves of pressure) --- */
  if (runT >= 40 && surgeWarn <= 0) {
    surgeT -= dt;
    if (surgeT <= 0) {
      surgeWarn = 1.8;
      sfx.warn();
    }
  }
  if (surgeWarn > 0) {
    surgeWarn -= dt;
    if (surgeWarn <= 0) {
      const n = 4 + zoneIdx;
      for (let i = 0; i < n; i++) spawnShade();
      for (let i = 0; i < 2; i++) spawnWisp();
      shake = Math.max(shake, 4);
      // Depth V rule: the choir quickens the surges
      surgeT = zoneIdx >= 4 ? rnd(25, 35) : rnd(38, 50);
    }
  }

  /* --- shades (difficulty ramps by elapsed time, after a grace period) --- */
  shadeSpawnT -= dt;
  const targetShades = runT < GRACE ? 0 : clamp(4 + Math.floor((runT - GRACE) / 9), 4, 11);
  if (shadeSpawnT <= 0 && shades.length < targetShades) {
    spawnShade();
    shadeSpawnT = rnd(0.7, 1.6);
  }

  const fr = frostT > 0 ? 0.3 : 1; // frost slows all shades
  let nearDanger = false;
  for (const s of shades) {
    s.wob += dt * 4 * fr;
    const dx = player.x - s.x, dy = player.y - s.y;
    const m = Math.hypot(dx, dy) || 1;

    // knockback from the ignited dash (decays)
    s.x += s.kvx * d; s.y += s.kvy * d;
    s.kvx *= Math.pow(0.88, d * 60); s.kvy *= Math.pow(0.88, d * 60);

    if (s.type === "darter") {
      if (s.windup > 0) {
        // telegraphed lunge: freeze and flash, direction locked at windup start
        s.windup -= dt * fr;
        if (s.windup <= 0) s.darting = 0.45;
      } else if (s.darting > 0) {
        s.darting -= dt;
        s.x += s.dvx * d * fr; s.y += s.dvy * d * fr;
      } else {
        s.dartCd -= dt * fr;
        if (s.dartCd <= 0 && m < 160) {
          s.windup = 0.35;
          s.dartCd = rnd(2.2, 3.5);
          s.dvx = dx / m * 320; s.dvy = dy / m * 320;
          burst(s.x, s.y, PAL.shade, 8, 2, 0.4);
        }
        s.x += dx / m * s.speed * 35 * d * fr;
        s.y += dy / m * s.speed * 35 * d * fr;
      }
    } else if (s.type === "orbiter") {
      if (s.windup > 0) {
        // telegraphed collapse: freeze and flash, direction locked at windup start
        s.windup -= dt * fr;
        if (s.windup <= 0) s.darting = 0.5;
      } else if (s.darting > 0) {
        // collapse straight through where the player was
        s.darting -= dt;
        s.x += s.dvx * d * fr; s.y += s.dvy * d * fr;
        if (s.darting <= 0) s.orbR = rnd(70, 100); // retreat to a wide orbit
      } else {
        // circle the player, spiraling inward
        s.orbA += dt * 1.7 * s.orbDir * fr;
        s.orbR = Math.max(30, s.orbR - dt * 9 * fr);
        const tx = player.x + Math.cos(s.orbA) * s.orbR;
        const ty = player.y + Math.sin(s.orbA) * s.orbR;
        const mm = Math.hypot(tx - s.x, ty - s.y) || 1;
        const sp = s.speed * 85 * fr;
        s.x += (tx - s.x) / mm * Math.min(sp * d, mm);
        s.y += (ty - s.y) / mm * Math.min(sp * d, mm);
        // once the orbit is tight, strike
        if (s.orbR <= 30.5 && m < 130) {
          s.windup = 0.4;
          s.dvx = dx / m * 280; s.dvy = dy / m * 280;
          burst(s.x, s.y, PAL.shade, 8, 2, 0.4);
        }
      }
    } else {
      // seeker / splitter: chase with wobble
      const chase = s.type === "splitter" ? 48 : 58;
      s.x += (dx / m * s.speed * chase + Math.cos(s.wob) * 14) * d * fr;
      s.y += (dy / m * s.speed * chase + Math.sin(s.wob * 1.3) * 14) * d * fr;
    }

    // near-miss tension
    if (m < 30 && m > player.r + s.r + 2) nearDanger = true;

    // collision
    if (player.dashT <= 0 && player.inv <= 0 &&
        dist2(s.x, s.y, player.x, player.y) < (player.r + s.r - 2) ** 2) {
      if (player.shield) {
        // shield absorbs the hit and vaporizes the attacker
        player.shield = false;
        player.inv = 1.0;
        burst(s.x, s.y, PAL.gold, 26, 3.5, 0.7);
        shades.splice(shades.indexOf(s), 1);
        shake = Math.max(shake, 6);
        flash = 0.5;
        slowmo = 0.3;
        sfx.shieldPop();
        break;
      }
      die();
      break;
    }
    // dashing through a shade destroys it!
    if (player.dashT > 0 && dist2(s.x, s.y, player.x, player.y) < (player.r + s.r + 4) ** 2) {
      burst(s.x, s.y, PAL.shade, 24, 3.5, 0.7);
      burst(s.x, s.y, PAL.danger, 8, 2, 0.4);
      shades.splice(shades.indexOf(s), 1);
      if (s.type === "splitter" && !s.small) {
        spawnSmallShade(s.x, s.y);
        spawnSmallShade(s.x, s.y);
      }
      slowmo = 0.25;
      shake = Math.max(shake, 5);
      flash = 0.5;
      beep(700, 0.18, "square", 0.08, -300);
      addScore(3);
      break;
    }
  }
  nearSfxT -= dt;
  if (nearDanger && nearSfxT <= 0) { sfx.near(); nearSfxT = rnd(0.15, 0.3); }
}

function die() {
  player.alive = false;
  state = "over";
  overTimer = 0;
  shake = 12;
  flash = 1;
  slowmo = 1.2;
  joy = null;
  sfx.hit();
  burst(player.x, player.y, PAL.ember, 40, 4.5, 1);
  burst(player.x, player.y, PAL.emberHot, 20, 3, 0.8);
  burst(player.x, player.y, "#ffffff", 10, 2, 0.5);
  if (score > best) {
    best = score;
    store.set("emberdrift_best", best);
    CG.happytime();            // a genuine celebratory moment
  }
  CG.gameplayStop();
  // a death is a level-transition equivalent: the moment their docs name as
  // appropriate for a midgame ad, and never mid-gameplay
  if (CG.ready) {
    adBusy = true;
    CG.requestMidgameAd(() => {});
  }
}

/* ---------- render helpers (draw into whatever `g` targets) ---------- */
function px(x, y, w, h, color) { g.fillStyle = color; g.fillRect(Math.round(x), Math.round(y), w, h); }

function glowCircle(x, y, r, color, alpha = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color);
  gr.addColorStop(1, "transparent");
  g.globalAlpha = alpha;
  g.fillStyle = gr;
  g.beginPath();
  g.arc(x, y, r, 0, TAU);
  g.fill();
  g.globalAlpha = 1;
}

function drawText(str, x, y, size, color, align = "center") {
  g.fillStyle = color;
  g.font = `bold ${size}px 'Courier New', Courier, monospace`;
  g.textAlign = align;
  g.textBaseline = "middle";
  g.fillText(str, Math.round(x), Math.round(y));
}

/* ---------- render ---------- */
function render() {
  if (isPortrait()) {
    g = wctx;
    wctx.setTransform(1, 0, 0, 1, 0, 0);
    wctx.fillStyle = "#0b0a14";
    wctx.fillRect(0, 0, W, H);
    // rotate pictogram: a portrait frame turning into a landscape one
    wctx.strokeStyle = PAL.ember;
    wctx.lineWidth = 2;
    wctx.strokeRect(W / 2 - 9, H / 2 - 58, 18, 28);
    wctx.globalAlpha = 0.45;
    wctx.strokeRect(W / 2 - 14, H / 2 - 52, 28, 18);
    wctx.globalAlpha = 1;
    drawText("rotate your device", W / 2, H / 2 + 6, 12, PAL.text);
    drawText("ember drift is played in landscape", W / 2, H / 2 + 26, 9, PAL.textDim);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(world, 0, 0, canvas.width, canvas.height);
    return;
  }

  /* ===== world layer: low-res pixel buffer ===== */
  g = wctx;
  wctx.setTransform(1, 0, 0, 1, 0, 0);
  wctx.save();
  if (shake > 0) wctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);

  // background gradient (zone-blended)
  const bg = wctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, rgbStr(curBg[0]));
  bg.addColorStop(0.6, rgbStr(curBg[1]));
  bg.addColorStop(1, rgbStr(curBg[2]));
  wctx.fillStyle = bg;
  wctx.fillRect(-10, -10, W + 20, H + 20);

  // stars
  for (const s of stars) {
    const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.8 + s.tw));
    wctx.globalAlpha = tw * s.z * 0.8;
    px(s.x, s.y, s.z > 0.7 ? 2 : 1, s.z > 0.7 ? 2 : 1, "#cdc8ff");
  }
  wctx.globalAlpha = 1;

  // distant hills (parallax silhouettes, zone-blended)
  wctx.fillStyle = rgbStr(curHill[0]);
  wctx.beginPath();
  wctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) {
    wctx.lineTo(x, H - 40 - Math.sin(x * 0.013 + 2) * 18 - Math.sin(x * 0.031) * 8);
  }
  wctx.lineTo(W, H);
  wctx.fill();
  wctx.fillStyle = rgbStr(curHill[1]);
  wctx.beginPath();
  wctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) {
    wctx.lineTo(x, H - 22 - Math.sin(x * 0.02 + 5) * 12 - Math.cos(x * 0.045) * 6);
  }
  wctx.lineTo(W, H);
  wctx.fill();

  // ambient motes
  for (const e of embers) {
    const a = 0.25 + 0.2 * Math.sin(e.ph * 2);
    glowCircle(e.x, e.y, 3 * e.s, "rgba(255,170,80,0.5)", a);
    px(e.x, e.y, 1, 1, PAL.ember);
  }

  // particles
  for (const p of parts) {
    wctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    px(p.x - p.size / 2, p.y - p.size / 2, Math.ceil(p.size), Math.ceil(p.size), p.color);
  }
  wctx.globalAlpha = 1;

  // power-ups (pulsing diamonds)
  for (const pu of powerups) {
    const c = pu.type === "shield" ? PAL.gold : PAL.frost;
    const bob = Math.sin(pu.ph) * 2;
    const y = pu.y + bob;
    const blink = pu.ttl < 3 && Math.sin(t * 12) > 0 ? 0.3 : 1;
    wctx.globalAlpha = blink;
    glowCircle(pu.x, y, 16, pu.type === "shield" ? "rgba(255,215,0,0.3)" : "rgba(159,216,255,0.3)");
    const sz = 5 + Math.sin(pu.ph * 1.5);
    wctx.fillStyle = c;
    wctx.beginPath();
    wctx.moveTo(pu.x, y - sz); wctx.lineTo(pu.x + sz, y);
    wctx.lineTo(pu.x, y + sz); wctx.lineTo(pu.x - sz, y);
    wctx.closePath(); wctx.fill();
    px(pu.x - 1, y - 1, 2, 2, "#ffffff");
    wctx.globalAlpha = 1;
  }

  // wisps
  for (const wsp of wisps) {
    const bob = Math.sin(wsp.ph) * 2;
    const y = wsp.y + bob;
    glowCircle(wsp.x, y, 14 + Math.sin(wsp.ph * 2) * 3, "rgba(125,249,255,0.35)");
    px(wsp.x - 2, y - 2, 4, 4, PAL.wisp);
    px(wsp.x - 1, y - 1, 2, 2, "#ffffff");
    // orbiting sparkle
    const oa = wsp.ph * 1.7;
    px(wsp.x + Math.cos(oa) * 8 - 0.5, y + Math.sin(oa) * 8 - 0.5, 1, 1, PAL.wispDim);
  }

  // shades
  for (const s of shades) {
    const r = s.r + Math.sin(s.wob * 2) * 1;
    const hot = s.type === "darter";
    const winding = s.windup > 0;
    const frosted = frostT > 0;
    glowCircle(s.x, s.y, r * 2.6,
      frosted ? "rgba(159,216,255,0.25)" :
      winding ? "rgba(255,74,106,0.5)" :
      hot ? "rgba(255,74,106,0.3)" : "rgba(177,74,237,0.28)");
    // jagged blob body — flashes white during an attack windup so it's readable
    wctx.fillStyle = frosted ? "#5b8fb0" :
      winding ? (Math.sin(t * 30) > 0 ? "#ffffff" : PAL.danger) :
      (s.darting > 0 ? PAL.danger : PAL.shade);
    wctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + s.wob * 0.5;
      const rr = r * (0.75 + 0.3 * Math.sin(i * 3 + s.wob * 2)) * (winding ? 1.2 : 1);
      const xx = s.x + Math.cos(a) * rr, yy = s.y + Math.sin(a) * rr;
      i === 0 ? wctx.moveTo(xx, yy) : wctx.lineTo(xx, yy);
    }
    wctx.closePath();
    wctx.fill();
    // dark core + eye
    wctx.fillStyle = frosted ? "#2b4a63" : PAL.shadeDim;
    wctx.beginPath(); wctx.arc(s.x, s.y, r * 0.55, 0, TAU); wctx.fill();
    const dx = player.x - s.x, dy = player.y - s.y, m = Math.hypot(dx, dy) || 1;
    px(s.x + dx / m * 2 - 1.5, s.y + dy / m * 2 - 1.5, 3, 3, hot ? PAL.danger : "#e9c6ff");
    // splitters get warning cracks
    if (s.type === "splitter") {
      wctx.strokeStyle = "rgba(233,198,255,0.5)";
      wctx.lineWidth = 1;
      wctx.beginPath();
      wctx.moveTo(s.x - r * 0.4, s.y - r * 0.3);
      wctx.lineTo(s.x + r * 0.1, s.y + r * 0.1);
      wctx.lineTo(s.x + r * 0.4, s.y - r * 0.2);
      wctx.stroke();
    }
  }

  // player
  {
    // trail
    for (let i = player.trail.length - 1; i >= 0; i--) {
      const tr = player.trail[i];
      const a = (1 - i / player.trail.length) * 0.6;
      wctx.globalAlpha = a;
      const sz = Math.max(1, (player.r - 1) * (1 - i / player.trail.length));
      px(tr.x - sz / 2, tr.y - sz / 2, sz, sz, tr.dash ? PAL.emberCore : PAL.ember);
    }
    wctx.globalAlpha = 1;

    if (player.alive) {
      const blink = player.inv > 0 && Math.sin(t * 25) > 0;
      if (!blink) {
        const dashGlow = player.dashT > 0 ? 1.8 : 1;
        glowCircle(player.x, player.y, 18 * dashGlow, "rgba(255,179,71,0.45)");
        // flame body (layered squares = pixel flame)
        const fl = Math.sin(t * 14) * 1.2;
        px(player.x - 4, player.y - 3 + fl * 0.3, 8, 7, PAL.ember);
        px(player.x - 3, player.y - 4 + fl * 0.5, 6, 7, PAL.ember);
        px(player.x - 2, player.y - 2, 4, 5, PAL.emberHot);
        px(player.x - 1, player.y - 1, 2, 3, PAL.emberCore);
        // little eyes
        px(player.x - 2, player.y, 1, 2, "#3a2410");
        px(player.x + 1, player.y, 1, 2, "#3a2410");
      }
      // shield ring
      if (player.shield) {
        wctx.strokeStyle = PAL.gold;
        wctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 6);
        wctx.lineWidth = 1.5;
        wctx.beginPath();
        const ra = t * 3;
        for (let i = 0; i <= 20; i++) {
          const a = i / 20 * TAU + ra;
          const rr = 11 + Math.sin(a * 5) * 1;
          const xx = player.x + Math.cos(a) * rr, yy = player.y + Math.sin(a) * rr;
          i === 0 ? wctx.moveTo(xx, yy) : wctx.lineTo(xx, yy);
        }
        wctx.stroke();
        wctx.globalAlpha = 1;
      }
    }
  }

  wctx.restore();

  /* ===== UI layer: drawn into the SAME low-res buffer as the world, so
     the Courier glyphs get upscaled into chunky pixels along with it.
     This is the original pipeline and what gives the game its look. ===== */
  g = wctx;

  if (state === "play" && titleA < 0.6) {
    drawText(String(score).padStart(4, "0"), W / 2, 20, 18, PAL.text);
    if (combo > 1) {
      const pulse = 1 + Math.sin(t * 10) * 0.08;
      drawText(`x${combo}`, W / 2 + 46, 20, Math.round(12 * pulse), PAL.gold);
    }
    // depth marker
    drawText(`DEPTH ${ZONES[zoneIdx].num}`, W - 14, 16, 10, PAL.textDim, "right");
    // dash cooldown bar
    const cdw = 50, pct = 1 - player.dashCd / 0.9;
    px(W / 2 - cdw / 2, 32, cdw, 3, "#2a2440");
    px(W / 2 - cdw / 2, 32, Math.round(cdw * pct), 3, pct >= 1 ? PAL.wisp : PAL.textDim);

    // frost timer
    if (frostT > 0) drawText(`frost ${frostT.toFixed(1)}`, 36, 17, 10, PAL.frost, "left");

    // surge warning
    if (surgeWarn > 0 && Math.sin(t * 14) > -0.2) {
      drawText("!  S U R G E   I N C O M I N G  !", W / 2, 58, 14, PAL.danger);
    }

    // zone banner: name + the rule that just changed
    if (zoneBanner > 0) {
      const a = clamp(zoneBanner > 3 ? (3.5 - zoneBanner) * 2 : zoneBanner / 3, 0, 1);
      ctx.globalAlpha = a;
      drawText(`— DEPTH ${ZONES[zoneIdx].num} —`, W / 2, H / 2 - 46, 12, PAL.textDim);
      drawText(ZONES[zoneIdx].name, W / 2, H / 2 - 26, 20, PAL.text);
      drawText(ZONES[zoneIdx].rule, W / 2, H / 2 - 6, 11, PAL.gold);
      ctx.globalAlpha = 1;
    }

    // first-run contextual tutorial (one short prompt per mechanic)
    if (tutStage < 3 && titleA < 0.5 && Math.sin(t * 3) > -0.6) {
      const msgs = isTouch ? [
        "touch and drag anywhere to steer",
        "collect the glowing wisps",
        "tap DASH — it destroys shades"
      ] : [
        "WASD or arrows to steer",
        "collect the glowing wisps",
        "press SPACE to dash — it destroys shades"
      ];
      drawText(msgs[tutStage], W / 2, H - 30, 12, PAL.text);
    }

    /* touch UI */
    if (isTouch) {
      // floating joystick
      if (joy) {
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(joy.bx, joy.by, JOY_R, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.5;
        const dx = joy.kx - joy.bx, dy = joy.ky - joy.by;
        const m = Math.hypot(dx, dy);
        const kx = m > JOY_R ? joy.bx + dx / m * JOY_R : joy.kx;
        const ky = m > JOY_R ? joy.by + dy / m * JOY_R : joy.ky;
        ctx.fillStyle = PAL.ember;
        ctx.beginPath(); ctx.arc(kx, ky, 10, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // dash button with cooldown sweep (bottom-right, clear of the HUD)
      const db = dashBtnPos();
      const pct2 = 1 - player.dashCd / 0.9;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#1a1730";
      ctx.beginPath(); ctx.arc(db.x, db.y, DASH_R, 0, TAU); ctx.fill();
      ctx.globalAlpha = pct2 >= 1 ? 0.85 : 0.4;
      ctx.strokeStyle = pct2 >= 1 ? PAL.wisp : PAL.textDim;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(db.x, db.y, DASH_R - 3, -Math.PI / 2, -Math.PI / 2 + TAU * pct2);
      ctx.stroke();
      ctx.globalAlpha = pct2 >= 1 ? 0.95 : 0.5;
      drawText("DASH", db.x, db.y, 10, pct2 >= 1 ? PAL.wisp : PAL.textDim);
      ctx.globalAlpha = 1;
    }
  }

  // speaker / mute toggle — always visible so audio state is never a mystery
  {
    const c = audioMuted() ? PAL.textDim : PAL.text;
    const x = SPK.x, y = SPK.y;
    wctx.globalAlpha = 0.75;
    px(x - 6, y - 2, 2, 4, c);
    px(x - 4, y - 4, 2, 8, c);
    px(x - 2, y - 6, 2, 12, c);
    if (audioMuted()) {
      for (let i = 0; i < 5; i++) { px(x + 2 + i, y - 4 + i, 1, 1, c); px(x + 6 - i, y - 4 + i, 1, 1, c); }
    } else {
      px(x + 2, y - 3, 1, 6, c);
      px(x + 5, y - 5, 1, 10, c);
    }
    wctx.globalAlpha = 1;
  }

  // the original title, now a fading overlay rather than a gate —
  // the game is already running behind it and it clears on first input
  if (titleA > 0) {
    const bob = Math.sin(t * 2) * 3;
    glowCircle(W / 2, 104 + bob, 110, "rgba(255,140,50,0.07)");
    wctx.globalAlpha = titleA * 0.92;
    drawText("E M B E R", W / 2, 86 + bob, 38, PAL.ember);
    drawText("D R I F T", W / 2, 122 + bob, 38, PAL.emberHot);
    wctx.globalAlpha = titleA;
    drawText("collect the wisps  ·  dodge the shades", W / 2, 168, 10, PAL.textDim);
    drawText("dash through shades to destroy them", W / 2, 182, 10, PAL.textDim);
    if (Math.sin(t * 4) > -0.3) {
      drawText(isTouch ? "— touch and drag to begin —" : "— press any key to begin —", W / 2, 215, 11, PAL.text);
    }
    drawText(isTouch ? "drag to move   ·   DASH button to dash"
                     : "WASD / arrows to move   ·   SPACE to dash", W / 2, 248, 9, PAL.textDim);
    if (best > 0) drawText(`best ${best}`, W / 2, 268, 9, PAL.gold);
    wctx.globalAlpha = 1;
  }

  if (state === "over") {
    ctx.fillStyle = "rgba(8,6,16,0.55)";
    ctx.fillRect(0, 0, W, H);
    drawText("THE EMBER FADES", W / 2, 82, 22, PAL.danger);
    drawText(`score  ${score}`, W / 2, 116, 15, PAL.text);
    drawText(`survived ${Math.floor(runT)}s in depth ${ZONES[zoneIdx].num} · ${ZONES[zoneIdx].name}`, W / 2, 138, 10, PAL.textDim);

    // near-miss hook: show how close the next depth was
    if (zoneIdx < ZONES.length - 1) {
      const cur = ZONES[zoneIdx], next = ZONES[zoneIdx + 1];
      const span = next.at - cur.at;
      const prog = clamp((depthClock() - cur.at) / span, 0, 1);
      const away = Math.max(1, Math.ceil(next.at - depthClock()));
      drawText(`DEPTH ${next.num} · ${next.name} was ~${away}s away`, W / 2, 162, 11, PAL.gold);
      const bw = 160;
      px(W / 2 - bw / 2, 174, bw, 4, "#2a2440");
      px(W / 2 - bw / 2, 174, Math.round(bw * prog), 4, PAL.gold);
    } else {
      drawText("you reached the final depth", W / 2, 162, 11, PAL.gold);
    }

    if (score >= best && score > 0) {
      const pulse = 1 + Math.sin(t * 8) * 0.1;
      drawText("★ NEW BEST ★", W / 2, 196, Math.round(13 * pulse), PAL.gold);
    } else if (best > 0) {
      drawText(`best  ${best}`, W / 2, 196, 11, PAL.textDim);
    }
    if (adBusy) {
      const dots = ".".repeat(1 + (Math.floor(t * 2) % 3));
      drawText(dots, W / 2, 226, 12, PAL.textDim);
    } else if (overTimer > 0.8 && Math.sin(t * 4) > -0.3) {
      drawText(isTouch ? "— tap to rekindle —" : "— press any key to rekindle —", W / 2, 226, 12, PAL.text);
    }
  }

  // hit flash
  if (flash > 0) {
    wctx.fillStyle = `rgba(255,240,220,${flash * 0.35})`;
    wctx.fillRect(0, 0, W, H);
  }

  /* ===== blit: nearest-neighbor upscale of world + UI together ===== */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.webkitImageSmoothingEnabled = false;
  ctx.drawImage(world, 0, 0, canvas.width, canvas.height);
}

/* ---------- main loop ---------- */
fitCanvas();
reset();

/* SDK boot runs in parallel with gameplay. Blocking the first frame on a
   network round-trip would directly hurt the conversion-to-gameplay metric,
   so the game is already playable while this resolves. */
(async () => {
  const ok = await CG.init();
  // SDK init is this game's only load phase (there are no assets to fetch),
  // and neither call registers before init resolves, so they are paired here.
  CG.loadingStart();
  CG.loadingStop();
  if (ok) {
    const cloudBest = +store.get("emberdrift_best", "0") || 0;
    if (cloudBest > best) best = cloudBest;
    if (store.get("emberdrift_tut", "0") === "1" && tutStage < 3) tutStage = 3;
  }
  CG.gameplayStart();
})();

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!isPortrait()) update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
